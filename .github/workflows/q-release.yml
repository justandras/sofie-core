name: Quarterly release cut

on:
  schedule:
    # First day of next quarter (UTC). Version = last completed quarter (see version-sync).
    # 1 Apr → 26.03, 1 Jul → 26.06, 1 Oct → 26.09, 1 Jan → prior year .12
    # Mid-quarter manual runs also target the last completed line (e.g. 3 Aug → 26.06).
    - cron: "0 0 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: q-release
  cancel-in-progress: false

jobs:
  cut-release:
    name: Cut release branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production-release' || 'release-automatic' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0
          # Avoid persisting GITHUB_TOKEN; App token must be the push identity for ruleset bypass.
          persist-credentials: false

      - name: Authenticate as GitHub App
        id: auth
        uses: ./.github/actions/app-git-auth
        with:
          app-client-id: ${{ vars.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".node-version"

      - name: Install packages dependencies
        run: corepack enable && yarn --cwd packages install --immutable

      - name: Resolve release date and branch
        id: release
        run: |
          # Last completed quarter (Oslo), not "yesterday" — mid-quarter manual
          # runs must not cut the in-progress line (e.g. 3 Aug → 26.06, not 26.09).
          BRANCH=$(node scripts/version-sync.mjs --mode stable --timezone Europe/Oslo --print-branch)
          # Docs / dropdown label is quarter only (YY.MM), never patch
          DOCS_VERSION="${BRANCH#release/}"
          YYMM=$(printf '%s' "$DOCS_VERSION" | awk -F. '{ printf "%s%02d", $1, $2 }')
          echo "yymm=$YYMM" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "docs_version=$DOCS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if release branch already exists
        id: exists
        run: |
          if git ls-remote --heads origin "${{ steps.release.outputs.branch }}" | grep -q .; then
            echo "Release branch ${{ steps.release.outputs.branch }} already exists"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Docs snapshot is independent of whether the release branch already exists
      # (otherwise a re-run after a bad cut never creates the correct docs version).
      - name: Snapshot Docusaurus docs on main
        id: docs
        run: |
          set -euo pipefail
          DOCS_VERSION="${{ steps.release.outputs.docs_version }}"
          VERSIONS_FILE=packages/documentation/versions.json

          if jq -e --arg v "$DOCS_VERSION" 'index($v) != null' "$VERSIONS_FILE" >/dev/null; then
            echo "Docusaurus version $DOCS_VERSION already exists"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          yarn --cwd packages/documentation docusaurus docs:version "$DOCS_VERSION"
          git add packages/documentation/versions.json \
            packages/documentation/versioned_docs \
            packages/documentation/versioned_sidebars
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(docs): snapshot documentation for ${DOCS_VERSION}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push docs snapshot to main
        if: steps.docs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main

      - name: Trigger docs deploy
        if: steps.docs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-docs.yml --ref main
          echo "Triggered deploy-docs.yml on main" >> "$GITHUB_STEP_SUMMARY"

      - name: Create release branch from main tip
        if: steps.exists.outputs.skip != 'true'
        run: |
          git fetch origin main
          git checkout -B "${{ steps.release.outputs.branch }}" origin/main

      - name: Version sync and tag
        if: steps.exists.outputs.skip != 'true'
        id: sync
        run: |
          set -euo pipefail
          OUTPUT_FILE=$(mktemp)
          if ! node scripts/version-sync.mjs \
            --mode stable \
            --timezone Europe/Oslo \
            --commit \
            --github-output >"$OUTPUT_FILE" 2>&1; then
            cat "$OUTPUT_FILE" >&2
            exit 1
          fi
          RESULT=$(tail -1 "$OUTPUT_FILE")
          echo "$RESULT" | jq -e . >/dev/null
          echo "tag=$(echo "$RESULT" | jq -r .tag)" >> "$GITHUB_OUTPUT"
          echo "floatingTag=$(echo "$RESULT" | jq -r .floatingTag)" >> "$GITHUB_OUTPUT"
          echo "skipped=$(echo "$RESULT" | jq -r .skipped)" >> "$GITHUB_OUTPUT"
          echo "branch=$(echo "$RESULT" | jq -r .branch)" >> "$GITHUB_OUTPUT"
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Push release branch and tags
        if: steps.exists.outputs.skip != 'true' && steps.sync.outputs.skipped != 'true' && steps.sync.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          BRANCH="${{ steps.sync.outputs.branch }}"
          TAG="${{ steps.sync.outputs.tag }}"
          FLOATING="${{ steps.sync.outputs.floatingTag }}"
          git push -u origin "HEAD:${BRANCH}"
          git push origin "$TAG" "+${FLOATING}"

      - name: Summary
        if: always()
        run: |
          echo "Docs version target: \`${{ steps.release.outputs.docs_version }}\` (changed=${{ steps.docs.outputs.changed }})" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.exists.outputs.skip }}" = "true" ]; then
            echo "Skipped release branch: already exists" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.sync.outputs.skipped }}" = "true" ]; then
            echo "Skipped version sync: no release changes (${{ steps.sync.outputs.json }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Released ${{ steps.sync.outputs.json }}" >> "$GITHUB_STEP_SUMMARY"
          fi
