name: Nightly release

on:
  schedule:
    # 23:00 UTC ≈ midnight Europe/Oslo (standard time)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to cut a nightly from (main moves floating nightly; other branches do not)
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.event_name == 'schedule' && 'main' || inputs.branch }}
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Cron / manual main: gated Environments. Feature-branch nightlies: ungated.
    environment: ${{ github.event_name == 'schedule' && 'release-automatic' || ((inputs.branch == 'main' || inputs.branch == 'refs/heads/main') && 'production-release' || 'release-development') }}
    steps:
      - name: Resolve target branch
        id: target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ inputs.branch }}"
            BRANCH="${BRANCH#refs/heads/}"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Authenticate as GitHub App
        id: auth
        uses: ./.github/actions/app-git-auth
        with:
          app-client-id: ${{ vars.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".node-version"

      - name: Install packages dependencies
        run: corepack enable && yarn --cwd packages install --immutable

      - name: Resolve nightly date
        id: date
        run: |
          echo "yymmdd=$(TZ=Europe/Oslo date +%y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Version sync and tag
        id: sync
        run: |
          set -euo pipefail
          OUTPUT_FILE=$(mktemp)
          if ! node scripts/version-sync.mjs \
            --mode nightly \
            --date "${{ steps.date.outputs.yymmdd }}" \
            --timezone Europe/Oslo \
            --commit \
            --github-output >"$OUTPUT_FILE" 2>&1; then
            cat "$OUTPUT_FILE" >&2
            exit 1
          fi
          RESULT=$(tail -1 "$OUTPUT_FILE")
          echo "$RESULT" | jq -e . >/dev/null
          echo "tag=$(echo "$RESULT" | jq -r .tag)" >> "$GITHUB_OUTPUT"
          echo "floatingTag=$(echo "$RESULT" | jq -r '.floatingTag // empty')" >> "$GITHUB_OUTPUT"
          echo "skipped=$(echo "$RESULT" | jq -r .skipped)" >> "$GITHUB_OUTPUT"
          echo "branch=$(echo "$RESULT" | jq -r .branch)" >> "$GITHUB_OUTPUT"
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Push branch and tags
        if: steps.sync.outputs.skipped != 'true' && steps.sync.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          BRANCH="${{ steps.sync.outputs.branch }}"
          TAG="${{ steps.sync.outputs.tag }}"
          FLOATING="${{ steps.sync.outputs.floatingTag }}"
          git push origin "HEAD:${BRANCH}"
          if [ -n "$FLOATING" ] && [ "$FLOATING" != "null" ]; then
            git push origin "$TAG" "+${FLOATING}"
          else
            git push origin "$TAG"
          fi

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.sync.outputs.skipped }}" = "true" ]; then
            echo "Skipped: nothing new to release (${{ steps.sync.outputs.json }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nightly release ${{ steps.sync.outputs.json }}" >> "$GITHUB_STEP_SUMMARY"
            if [ -z "${{ steps.sync.outputs.floatingTag }}" ] || [ "${{ steps.sync.outputs.floatingTag }}" = "null" ]; then
              echo "Floating \`nightly\` tag was not moved (non-main branch)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
