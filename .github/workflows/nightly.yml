name: Nightly release

on:
  schedule:
    # 23:00 UTC ≈ midnight Europe/Oslo (standard time)
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Cron / manual main: gated Environments. Feature-branch nightlies: ungated.
    # Manual runs always use the branch selected in the Actions UI ("Use workflow from").
    environment: ${{ github.event_name == 'schedule' && 'release-automatic' || (github.ref_name == 'main' && 'production-release' || 'release-development') }}
    steps:
      - name: Resolve target branch
        id: target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ github.ref_name }}"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            if [ "$BRANCH" = "main" ]; then
              echo "is_main=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_main=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: steps.target.outputs.is_main == 'true'
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0
          # Avoid persisting GITHUB_TOKEN; App token must be the push identity for ruleset bypass.
          persist-credentials: false

      - name: Authenticate as GitHub App
        if: steps.target.outputs.is_main == 'true'
        id: auth
        uses: ./.github/actions/app-git-auth
        with:
          app-client-id: ${{ vars.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: steps.target.outputs.is_main == 'true'
        with:
          node-version-file: ".node-version"

      - name: Install packages dependencies
        if: steps.target.outputs.is_main == 'true'
        run: corepack enable && yarn --cwd packages install --immutable

      - name: Resolve nightly date
        if: steps.target.outputs.is_main == 'true'
        id: date
        run: |
          echo "yymmdd=$(TZ=Europe/Oslo date +%y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Version sync and tag
        if: steps.target.outputs.is_main == 'true'
        id: sync
        run: |
          set -euo pipefail
          OUTPUT_FILE=$(mktemp)
          if ! node scripts/version-sync.mjs \
            --mode nightly \
            --date "${{ steps.date.outputs.yymmdd }}" \
            --timezone Europe/Oslo \
            --commit \
            --github-output >"$OUTPUT_FILE" 2>&1; then
            cat "$OUTPUT_FILE" >&2
            exit 1
          fi
          RESULT=$(tail -1 "$OUTPUT_FILE")
          echo "$RESULT" | jq -e . >/dev/null
          echo "tag=$(echo "$RESULT" | jq -r .tag)" >> "$GITHUB_OUTPUT"
          echo "floatingTag=$(echo "$RESULT" | jq -r '.floatingTag // empty')" >> "$GITHUB_OUTPUT"
          echo "skipped=$(echo "$RESULT" | jq -r .skipped)" >> "$GITHUB_OUTPUT"
          echo "branch=$(echo "$RESULT" | jq -r .branch)" >> "$GITHUB_OUTPUT"
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Push main and tags
        if: steps.target.outputs.is_main == 'true' && steps.sync.outputs.skipped != 'true' && steps.sync.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          TAG="${{ steps.sync.outputs.tag }}"
          FLOATING="${{ steps.sync.outputs.floatingTag }}"
          git push origin main
          git push origin "$TAG" "+${FLOATING}"

      - name: Publish artifacts from feature branch
        if: steps.target.outputs.is_main != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.target.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # No checkout on feature nightlies — tell gh which repo explicitly.
          gh workflow run publish-libs.yml --repo "$REPOSITORY" --ref "$BRANCH"
          gh workflow run node.yaml --repo "$REPOSITORY" --ref "$BRANCH"
          echo "Triggered publish-libs.yml and node.yaml on \`$BRANCH\` (no git commit/tag)." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always() && steps.target.outputs.is_main == 'true'
        run: |
          if [ "${{ steps.sync.outputs.skipped }}" = "true" ]; then
            echo "Skipped: nothing new to release (${{ steps.sync.outputs.json }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nightly release ${{ steps.sync.outputs.json }}" >> "$GITHUB_STEP_SUMMARY"
          fi
